# Déploiement Render : site statique BREAK & CREATE, servi tel quel depuis site/ (aucune compilation).
services:
  - type: web
    name: break-and-create
    runtime: static
    buildCommand: ""
    staticPublishPath: site
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
